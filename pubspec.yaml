name: lost_and_found
description: 校园失物招领AI助手 - Flutter 前端
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 认证 + 图片存储（Supabase）
  supabase_flutter: ^2.8.0
  # 拍照 / 相册选图
  image_picker: ^1.1.2
  # 后端 HTTP 请求
  dio: ^5.7.0
  # .env 环境变量
  flutter_dotenv: ^5.2.1
  # 日期格式化
  intl: ^0.19.0
  # 网络图片缓存
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
